[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
tokenizers = "1.0.0-rc.2"
wgpu = "30"
faer = "0.24"

# Local
riml-cuda.path = "crates/cuda"
riml-hip.path = "crates/hip"
riml-hip-sys.path = "crates/hip-sys"
riml-rocm.path = "crates/rocm"
